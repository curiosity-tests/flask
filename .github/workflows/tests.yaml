name: Tests
on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  push:
    branches: [main, stable]
    paths-ignore: ['docs/**', 'README.md']
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false
env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "Tests ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  tests:
    name: ${{ matrix.name || matrix.python }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.15'}
          - {python: '3.14'}
          - {python: '3.14t'}
          - {python: '3.13'}
          - {python: '3.12'}
          - {python: '3.11'}
          - {python: '3.10'}
          - {name: PyPy, python: 'pypy-3.11', tox: pypy3.11}
          - {name: Minimum Versions, python: '3.14', tox: tests-min}
          - {name: Development Versions, python: '3.10', tox: tests-dev}
    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          persist-credentials: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: uv run --locked --no-default-groups --group dev tox run
        env:
          TOX_ENV: ${{ matrix.tox || format('py{0}', matrix.python) }}
  typing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          persist-credentials: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: pyproject.toml
      - name: cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.mypy_cache
          key: mypy|${{ hashFiles('pyproject.toml') }}
      - run: uv run --locked --no-default-groups --group dev tox run -e typing
